[versions]
androidGradlePlugin = "8.7.3"
kotlin = "2.1.20"
googleServices = "4.4.4"
kotlinxSerializationJson = "1.8.0"

livedigitalSdk = "1.7.0"

# Conference (XML) UI stack
appcompat = "1.7.0"
material = "1.12.0"
recyclerview = "1.4.0"

# Compose stack (conference-compose + calls)
activityCompose = "1.10.0"
composeBom = "2026.04.01"

# Calls: telephony + push + foreground service + network inspector
coreTelecom = "1.0.1"
firebaseBom = "34.8.0"
lifecycleService = "2.10.0"
chucker = "4.0.0"

# Networking / DI
retrofit = "2.11.0"
loggingInterceptor = "4.12.0"
koin = "4.0.2"

permissionChecker = "0.1"

[libraries]
livedigital-sdk = { group = "com.github.vlprojects", name = "livedigital-android-sdk", version.ref = "livedigitalSdk" }

# Conference (XML) UI
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }

# Compose UI
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }

# Calls
androidx-core-telecom = { module = "androidx.core:core-telecom", version.ref = "coreTelecom" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycleService" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }
chucker-library = { group = "com.github.chuckerteam.chucker", name = "library", version.ref = "chucker" }

# Networking / serialization / DI
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
retrofit2-retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit2-kotlinx-serialization-converter = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp3-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "loggingInterceptor" }
koin = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }

sequenia-permissionChecker = { group = "com.github.sequenia", name = "Permission-Checker", version.ref = "permissionChecker" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
